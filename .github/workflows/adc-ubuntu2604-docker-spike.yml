name: ADC Ubuntu 26.04 - Packer Docker spike
run-name: ADC Ubuntu 26.04 x64 - privileged=${{ inputs.privileged }} - storage=${{ inputs.docker_storage }}

on:
  workflow_dispatch:
    inputs:
      privileged:
        description: Allow privileged containers on the disposable GitHub-hosted runner
        type: boolean
        default: false
      save_image:
        description: Upload a docker save archive for manual ADC import (potentially large; not OCI layout)
        type: boolean
        default: true
      docker_storage:
        description: Nested Docker storage experiment (default leaves daemon configuration unchanged)
        type: choice
        options:
          - default
          - overlay2
        default: default
      skip_docker_image_preload:
        description: Skip Dependabot and AW preloads only (functional Docker build/run runs manually in ADC)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  docker-spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      SPIKE_DIRECTORY: images/ubuntu/adc-spike
      BOOTSTRAP_IMAGE: adc-ubuntu2604-bootstrap:${{ github.run_id }}-${{ github.run_attempt }}
      SPIKE_IMAGE: adc-ubuntu2604-spike:${{ github.run_id }}-${{ github.run_attempt }}
      BUILD_CONTAINER: adc-build-${{ github.run_id }}-${{ github.run_attempt }}
      PRIVILEGED: ${{ inputs.privileged }}
      PKR_VAR_docker_storage: ${{ inputs.docker_storage }}
      PKR_VAR_skip_docker_image_preload: ${{ inputs.skip_docker_image_preload }}

    steps:
      - name: Prepare artifact directory
        id: paths
        run: |
          mkdir -p "$RUNNER_TEMP/adc-docker-spike"
          echo "OUTPUT_DIRECTORY=$RUNNER_TEMP/adc-docker-spike" >> "$GITHUB_ENV"
          echo "directory=$RUNNER_TEMP/adc-docker-spike" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: 1.15.4

      - name: Record build environment
        run: |
          mkdir -p "$OUTPUT_DIRECTORY"
          test "$(uname -m)" = x86_64
          docker info > "$OUTPUT_DIRECTORY/host-docker-info.txt"
          df -h > "$OUTPUT_DIRECTORY/host-disk.txt"
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg architecture x64 \
            --arg privileged "$PRIVILEGED" \
            --arg docker_storage "$PKR_VAR_docker_storage" \
            --argjson skip_docker_image_preload "$PKR_VAR_skip_docker_image_preload" \
            --arg run "$GITHUB_RUN_ID" \
            '{commit: $commit, architecture: $architecture, privileged: $privileged, docker_storage: $docker_storage, skip_docker_image_preload: $skip_docker_image_preload, run: $run}' \
            > "$OUTPUT_DIRECTORY/run.json"
          cp images/ubuntu/toolsets/toolset-2604.json "$OUTPUT_DIRECTORY/toolset.json"
          cp "$SPIKE_DIRECTORY/verify-spike.sh" "$OUTPUT_DIRECTORY/verify-spike.sh"
          jq -n '{runtime_validation: "not_run", target: "fresh ADC microVM", command: "sudo bash /imagegeneration/adc-spike/verify-spike.sh runtime"}' \
            > "$OUTPUT_DIRECTORY/runtime-validation.json"

      - name: Build systemd bootstrap
        run: |
          docker pull --platform linux/amd64 ubuntu:26.04 \
            2>&1 | tee "$OUTPUT_DIRECTORY/base-image-pull.log"
          docker image inspect ubuntu:26.04 > "$OUTPUT_DIRECTORY/base-image.json"
          base_image=$(docker image inspect --format '{{index .RepoDigests 0}}' ubuntu:26.04)
          docker build --platform linux/amd64 \
            --build-arg "BASE_IMAGE=$base_image" \
            --iidfile "$OUTPUT_DIRECTORY/bootstrap-image-id.txt" \
            --tag "$BOOTSTRAP_IMAGE" "$SPIKE_DIRECTORY" \
            2>&1 | tee "$OUTPUT_DIRECTORY/bootstrap.log"

      - name: Initialize and validate Packer
        env:
          PKR_VAR_base_image: ${{ env.BOOTSTRAP_IMAGE }}
          PKR_VAR_container_name: ${{ env.BUILD_CONTAINER }}
          PKR_VAR_image_tag: ${{ github.run_id }}-${{ github.run_attempt }}
          PKR_VAR_output_directory: ${{ steps.paths.outputs.directory }}
          PKR_VAR_privileged: ${{ inputs.privileged }}
        run: |
          packer init "$SPIKE_DIRECTORY"
          packer fmt -check "$SPIKE_DIRECTORY"
          packer validate "$SPIKE_DIRECTORY"

      - name: Provision and commit with Packer Docker builder
        id: build
        env:
          PKR_VAR_base_image: ${{ env.BOOTSTRAP_IMAGE }}
          PKR_VAR_container_name: ${{ env.BUILD_CONTAINER }}
          PKR_VAR_image_tag: ${{ github.run_id }}-${{ github.run_attempt }}
          PKR_VAR_output_directory: ${{ steps.paths.outputs.directory }}
          PKR_VAR_privileged: ${{ inputs.privileged }}
          PACKER_LOG: '1'
          PACKER_LOG_PATH: ${{ steps.paths.outputs.directory }}/packer-debug.log
        run: |
          # Preserve a failed container for the diagnostic and cleanup steps.
          timeout --signal=TERM --kill-after=30s 45m \
            packer build -on-error=abort "$SPIKE_DIRECTORY" \
            2>&1 | tee "$OUTPUT_DIRECTORY/packer-build.log"
          docker image inspect "$SPIKE_IMAGE" > "$OUTPUT_DIRECTORY/committed-image.json"

      - name: Check installed files in the committed image (no runtime validation)
        id: verify
        run: |
          timeout --signal=TERM --kill-after=10s 10m \
            docker run --rm --entrypoint /bin/bash "$SPIKE_IMAGE" \
              /imagegeneration/adc-spike/verify-spike.sh build \
            2>&1 | tee "$OUTPUT_DIRECTORY/committed-image-checks.log"

      - name: Save committed image
        if: success() && inputs.save_image
        run: |
          docker image save "$SPIKE_IMAGE" | gzip > "$OUTPUT_DIRECTORY/image.tar.gz"
          (cd "$OUTPUT_DIRECTORY" && sha256sum image.tar.gz > image.tar.gz.sha256)

      - name: Collect container diagnostics
        if: always()
        run: |
          mkdir -p "$OUTPUT_DIRECTORY"
          container="$BUILD_CONTAINER"
          if docker container inspect "$container" > "$OUTPUT_DIRECTORY/$container-inspect.json" 2>&1; then
              docker logs "$container" > "$OUTPUT_DIRECTORY/$container-console.log" 2>&1
              if [[ "$(docker inspect --format '{{.State.Running}}' "$container")" == true ]]; then
                  if ! timeout --signal=TERM --kill-after=10s 2m \
                      docker exec --interactive "$container" bash -s \
                      < "$SPIKE_DIRECTORY/diagnose-docker.sh" \
                      > "$OUTPUT_DIRECTORY/$container-docker-storage.log" 2>&1; then
                      echo "::warning::Docker storage diagnostics were incomplete for $container; see diagnostic log."
                  fi
                  if ! docker exec "$container" journalctl --no-pager --lines=200 \
                      > "$OUTPUT_DIRECTORY/$container-journal.log" 2>&1; then
                      echo "::warning::Could not read journal from $container; see diagnostic log."
                  fi
              fi
          else
              echo "Container $container is absent; see Packer log for provisioning details."
          fi

      - name: Write summary
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          {
              echo "## Ubuntu 26.04 x64 - Packer Docker spike"
              echo ""
              echo "| Check | Result |"
              echo "| --- | --- |"
              echo "| Privileged containers | $PRIVILEGED |"
              echo "| Requested nested Docker storage | $PKR_VAR_docker_storage |"
              echo "| Dependabot and AW image preloads skipped | $PKR_VAR_skip_docker_image_preload |"
              echo "| Packer provisioning and commit | $BUILD_OUTCOME |"
              echo "| Committed-image installed-file checks | $VERIFY_OUTCOME |"
              echo "| ADC microVM runtime checks | NOT RUN - manual validation required |"
              echo ""
              echo "This is a limited container spike, not a full runner image."
              echo "Installer smoke tests still execute during provisioning; functional Docker build/run is deferred."
              echo "ADC microVM, reboot, OCI import, ACR distribution and image layers are not tested."
              echo 'After importing the image into ADC and starting a fresh microVM, run:'
              echo '```bash'
              echo 'sudo bash /imagegeneration/adc-spike/verify-spike.sh runtime'
              echo '```'
              echo "The archive is docker save format, not OCI layout; confirm ADC accepts it or convert through a supported registry/import path."
              if [[ "$PKR_VAR_skip_docker_image_preload" == true ]]; then
                  echo "Dependabot and AW preloads were explicitly disabled; a passing job does not validate those image pulls."
              fi
              echo "Download the diagnostic artifact even if the job failed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload spike artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adc-ubuntu2604-docker-spike-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.directory }}
          if-no-files-found: error
          retention-days: 7

      - name: Remove only this run's build container
        if: always()
        run: |
          if docker container inspect "$BUILD_CONTAINER" > /dev/null 2>&1; then
              docker container rm --force "$BUILD_CONTAINER"
          fi
