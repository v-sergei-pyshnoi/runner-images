name: ADC Ubuntu 26.04 - shared Packer template
run-name: ADC Ubuntu 26.04 x64 - ${{ inputs.operation }} - storage=${{ inputs.docker_storage }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build a new image or publish a saved build to the test ACR
        type: choice
        options:
          - build
          - publish_saved
        default: build
      source_run:
        description: Successful build run ID to publish (publish_saved only)
        type: string
        default: '44317616785'
      source_attempt:
        description: Build run attempt to publish (publish_saved only)
        type: string
        default: '1'
      privileged:
        description: Allow privileged containers on the disposable GitHub-hosted runner
        type: boolean
        default: false
      save_image:
        description: Upload a docker save archive for manual ADC import (potentially large; not OCI layout)
        type: boolean
        default: true
      docker_storage:
        description: Nested Docker storage experiment (default leaves daemon configuration unchanged)
        type: choice
        options:
          - default
          - overlay2
        default: default
      skip_docker_image_preload:
        description: Skip Dependabot and AW preloads only (functional Docker build/run runs manually in ADC)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  docker-spike:
    if: inputs.operation != 'publish_saved'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      SPIKE_DIRECTORY: images/ubuntu/adc-spike
      PACKER_DIRECTORY: ${{ github.workspace }}/images/ubuntu/.adc-packer
      BOOTSTRAP_IMAGE: adc-ubuntu2604-bootstrap:${{ github.run_id }}-${{ github.run_attempt }}
      SPIKE_IMAGE: adc-ubuntu2604-spike:${{ github.run_id }}-${{ github.run_attempt }}
      BUILD_CONTAINER: adc-build-${{ github.run_id }}-${{ github.run_attempt }}
      PRIVILEGED: ${{ inputs.privileged }}
      PKR_VAR_docker_storage: ${{ inputs.docker_storage }}
      PKR_VAR_skip_docker_image_preload: ${{ inputs.skip_docker_image_preload }}
      PKR_VAR_cloud_provider: docker
      PKR_VAR_image_os: ubuntu26
      PKR_VAR_image_version: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Prepare artifact directory
        id: paths
        run: |
          mkdir -p "$RUNNER_TEMP/adc-docker-spike"
          echo "OUTPUT_DIRECTORY=$RUNNER_TEMP/adc-docker-spike" >> "$GITHUB_ENV"
          echo "directory=$RUNNER_TEMP/adc-docker-spike" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare shared Ubuntu 26.04 template
        run: |
          mkdir -p "$PACKER_DIRECTORY"
          cp images/ubuntu/templates/build.ubuntu-26_04.pkr.hcl \
            images/ubuntu/templates/variable.ubuntu.pkr.hcl "$PACKER_DIRECTORY/"
          cp "$SPIKE_DIRECTORY/docker.pkr.hcl" "$PACKER_DIRECTORY/"

      - name: Reclaim preinstalled SDK space on the disposable runner
        run: |
          df -h /
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Set up Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: 1.15.4

      - name: Record build environment
        run: |
          mkdir -p "$OUTPUT_DIRECTORY"
          test "$(uname -m)" = x86_64
          docker info > "$OUTPUT_DIRECTORY/host-docker-info.txt"
          df -h > "$OUTPUT_DIRECTORY/host-disk.txt"
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg architecture x64 \
            --arg toolset_profile full \
            --arg privileged "$PRIVILEGED" \
            --arg docker_storage "$PKR_VAR_docker_storage" \
            --argjson skip_docker_image_preload "$PKR_VAR_skip_docker_image_preload" \
            --arg run "$GITHUB_RUN_ID" \
            '{commit: $commit, architecture: $architecture, toolset_profile: $toolset_profile, privileged: $privileged, docker_storage: $docker_storage, skip_docker_image_preload: $skip_docker_image_preload, run: $run}' \
            > "$OUTPUT_DIRECTORY/run.json"
          cp images/ubuntu/toolsets/toolset-2604.json "$OUTPUT_DIRECTORY/toolset.json"
          cp "$SPIKE_DIRECTORY/verify-spike.sh" "$OUTPUT_DIRECTORY/verify-spike.sh"
          jq -n '{runtime_validation: "not_run", target: "fresh ADC microVM", command: "sudo bash /imagegeneration/adc-spike/verify-spike.sh runtime"}' \
            > "$OUTPUT_DIRECTORY/runtime-validation.json"

      - name: Build systemd bootstrap
        run: |
          docker pull --platform linux/amd64 ubuntu:26.04 \
            2>&1 | tee "$OUTPUT_DIRECTORY/base-image-pull.log"
          docker image inspect ubuntu:26.04 > "$OUTPUT_DIRECTORY/base-image.json"
          base_image=$(docker image inspect --format '{{index .RepoDigests 0}}' ubuntu:26.04)
          docker build --platform linux/amd64 \
            --build-arg "BASE_IMAGE=$base_image" \
            --iidfile "$OUTPUT_DIRECTORY/bootstrap-image-id.txt" \
            --tag "$BOOTSTRAP_IMAGE" "$SPIKE_DIRECTORY" \
            2>&1 | tee "$OUTPUT_DIRECTORY/bootstrap.log"

      - name: Initialize and validate Packer
        env:
          PKR_VAR_base_image: ${{ env.BOOTSTRAP_IMAGE }}
          PKR_VAR_container_name: ${{ env.BUILD_CONTAINER }}
          PKR_VAR_privileged: ${{ inputs.privileged }}
        run: |
          packer init "$PACKER_DIRECTORY"
          packer fmt -check "$PACKER_DIRECTORY"
          packer validate "$PACKER_DIRECTORY"

      - name: Provision and commit with Packer Docker builder
        id: build
        env:
          PKR_VAR_base_image: ${{ env.BOOTSTRAP_IMAGE }}
          PKR_VAR_container_name: ${{ env.BUILD_CONTAINER }}
          PKR_VAR_privileged: ${{ inputs.privileged }}
          PACKER_LOG: '1'
          PACKER_LOG_PATH: ${{ steps.paths.outputs.directory }}/packer-debug.log
        run: |
          # Preserve a failed container for the diagnostic and cleanup steps.
          timeout --signal=TERM --kill-after=30s 300m \
            packer build -on-error=abort "$PACKER_DIRECTORY" \
            2>&1 | tee "$OUTPUT_DIRECTORY/packer-build.log"
          cp "$PACKER_DIRECTORY/packer-manifest.json" \
            images/ubuntu/Ubuntu2604-Readme.md images/ubuntu/software-report.json "$OUTPUT_DIRECTORY/"
          image_id=$(jq --exit-status --raw-output '.builds[-1].artifact_id' "$OUTPUT_DIRECTORY/packer-manifest.json")
          docker image tag "$image_id" "$SPIKE_IMAGE"
          docker image inspect "$SPIKE_IMAGE" > "$OUTPUT_DIRECTORY/committed-image.json"

      - name: Check installed files in the committed image (no runtime validation)
        id: verify
        run: |
          timeout --signal=TERM --kill-after=10s 10m \
            docker run --rm --entrypoint /bin/bash "$SPIKE_IMAGE" \
              /imagegeneration/adc-spike/verify-spike.sh build \
            2>&1 | tee "$OUTPUT_DIRECTORY/committed-image-checks.log"

      - name: Save committed image
        if: success() && inputs.save_image
        run: |
          docker image save "$SPIKE_IMAGE" | gzip > "$OUTPUT_DIRECTORY/image.tar.gz"
          python3 "$SPIKE_DIRECTORY/check-image-archive.py" "$OUTPUT_DIRECTORY/image.tar.gz" \
            | tee "$OUTPUT_DIRECTORY/image-device-check.log"
          (cd "$OUTPUT_DIRECTORY" && sha256sum image.tar.gz > image.tar.gz.sha256)

      - name: Collect container diagnostics
        if: always()
        run: |
          mkdir -p "$OUTPUT_DIRECTORY"
          container="$BUILD_CONTAINER"
          if docker container inspect "$container" > "$OUTPUT_DIRECTORY/$container-inspect.json" 2>&1; then
              docker logs "$container" > "$OUTPUT_DIRECTORY/$container-console.log" 2>&1
              if [[ "$(docker inspect --format '{{.State.Running}}' "$container")" == true ]]; then
                  if ! timeout --signal=TERM --kill-after=10s 2m \
                      docker exec --interactive "$container" bash -s \
                      < "$SPIKE_DIRECTORY/diagnose-docker.sh" \
                      > "$OUTPUT_DIRECTORY/$container-docker-storage.log" 2>&1; then
                      echo "::warning::Docker storage diagnostics were incomplete for $container; see diagnostic log."
                  fi
                  if ! docker exec "$container" journalctl --no-pager --lines=200 \
                      > "$OUTPUT_DIRECTORY/$container-journal.log" 2>&1; then
                      echo "::warning::Could not read journal from $container; see diagnostic log."
                  fi
              fi
          else
              echo "Container $container is absent; see Packer log for provisioning details."
          fi

      - name: Write summary
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          {
              echo "## Ubuntu 26.04 x64 - shared Packer template"
              echo ""
              echo "| Check | Result |"
              echo "| --- | --- |"
              echo "| Privileged containers | $PRIVILEGED |"
              echo "| Requested nested Docker storage | $PKR_VAR_docker_storage |"
              echo "| Dependabot and AW image preloads skipped | $PKR_VAR_skip_docker_image_preload |"
              echo "| Packer provisioning and commit | $BUILD_OUTCOME |"
              echo "| Committed-image installed-file checks | $VERIFY_OUTCOME |"
              echo "| ADC microVM runtime checks | NOT RUN - manual validation required |"
              echo ""
              echo "This attempts the original Ubuntu 26.04 software installer list using the Docker builder."
              echo "VM reboot, cleanup, deprovisioning and the final full test suite are excluded from Docker builds."
              echo "A failed installer aborts the build; the software report is produced only after installation completes."
              echo "Installer smoke tests still execute during provisioning; functional Docker build/run is deferred."
              echo "ADC microVM, reboot, OCI import, ACR distribution and image layers are not tested."
              echo 'After importing the image into ADC and starting a fresh microVM, run:'
              echo '```bash'
              echo 'sudo bash /imagegeneration/adc-spike/verify-spike.sh runtime'
              echo '```'
              echo "The archive is docker save format, not OCI layout; confirm ADC accepts it or convert through a supported registry/import path."
              if [[ "$PKR_VAR_skip_docker_image_preload" == true ]]; then
                  echo "Dependabot and AW preloads were explicitly disabled; a passing job does not validate those image pulls."
              fi
              echo "Download the diagnostic artifact even if the job failed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload spike artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adc-ubuntu2604-docker-spike-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.directory }}
          if-no-files-found: error
          retention-days: 7

      - name: Remove only this run's build container
        if: always()
        run: |
          if docker container inspect "$BUILD_CONTAINER" > /dev/null 2>&1; then
              docker container rm --force "$BUILD_CONTAINER"
          fi

  publish-saved:
    if: inputs.operation == 'publish_saved'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: bash
    env:
      SOURCE_RUN: ${{ inputs.source_run }}
      SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
      REGISTRY: runnerubuntu26test.azurecr.io
      IMAGE_REPOSITORY: ubuntu2604-spike
    steps:
      - name: Checkout archive validator
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate source build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$SOURCE_RUN" =~ ^[1-9][0-9]*$ || ! "$SOURCE_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Source run and attempt must be positive integers."
              exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/attempts/$SOURCE_ATTEMPT" \
            > "$RUNNER_TEMP/adc-source-run.json"
          jq --exit-status \
            '.conclusion == "success" and .event == "workflow_dispatch"
             and .head_branch == "ubuntu-docker"
             and .path == ".github/workflows/adc-ubuntu2604-docker-spike.yml"' \
            "$RUNNER_TEMP/adc-source-run.json"
          {
              echo "SOURCE_IMAGE=adc-ubuntu2604-spike:$SOURCE_RUN-$SOURCE_ATTEMPT"
              echo "TARGET_IMAGE=$REGISTRY/$IMAGE_REPOSITORY:$SOURCE_RUN-$SOURCE_ATTEMPT"
              echo "DOCKER_CONFIG=$RUNNER_TEMP/adc-acr-auth"
          } >> "$GITHUB_ENV"

      - name: Download saved build
        uses: actions/download-artifact@v4
        with:
          name: adc-ubuntu2604-docker-spike-${{ inputs.source_run }}-${{ inputs.source_attempt }}
          path: ${{ runner.temp }}/adc-saved-image
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}

      - name: Verify and load image
        working-directory: ${{ runner.temp }}/adc-saved-image
        run: |
          sha256sum --check image.tar.gz.sha256
          python3 "$GITHUB_WORKSPACE/images/ubuntu/adc-spike/check-image-archive.py" image.tar.gz
          gzip --decompress --stdout image.tar.gz | docker image load
          platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$SOURCE_IMAGE")
          if [[ "$platform" != linux/amd64 ]]; then
              echo "::error::Expected linux/amd64; found $platform."
              exit 1
          fi
          docker image tag "$SOURCE_IMAGE" "$TARGET_IMAGE"

      - name: Log in to test ACR
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          if [[ -z "$ACR_USERNAME" || -z "$ACR_PASSWORD" ]]; then
              echo "::error::Configure the ACR_USERNAME and ACR_PASSWORD repository secrets."
              exit 1
          fi
          mkdir -p "$DOCKER_CONFIG"
          chmod 700 "$DOCKER_CONFIG"
          printf '%s' "$ACR_PASSWORD" | docker login "$REGISTRY" \
            --username "$ACR_USERNAME" --password-stdin

      - name: Push image and verify registry digest
        run: |
          docker image push "$TARGET_IMAGE"
          docker buildx imagetools inspect "$TARGET_IMAGE" \
            --format '{{json .Manifest}}' > "$RUNNER_TEMP/adc-registry-manifest.json"
          digest=$(jq --exit-status --raw-output '.digest' "$RUNNER_TEMP/adc-registry-manifest.json")
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Registry returned an invalid image digest."
              exit 1
          fi
          {
              echo "## Published Ubuntu 26.04 spike"
              echo ""
              echo "Tag: \`$TARGET_IMAGE\`"
              echo ""
              echo "Digest reference: \`$REGISTRY/$IMAGE_REPOSITORY@$digest\`"
              echo ""
              echo "Source: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/attempts/$SOURCE_ATTEMPT"
              echo ""
              echo "ADC microVM runtime validation: **NOT RUN**."
              echo "Publishing an image does not validate its ADC runtime; see the source build metadata and software report for its toolset."
              echo "After creating a fresh ADC microVM from this image, run:"
              echo '```bash'
              echo 'sudo bash /imagegeneration/adc-spike/verify-spike.sh runtime'
              echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove registry credentials
        if: always()
        run: |
          if [[ -f "$DOCKER_CONFIG/config.json" ]]; then
              docker logout "$REGISTRY"
              rm -f "$DOCKER_CONFIG/config.json"
          fi
